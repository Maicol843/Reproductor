<!-- 
LOOP

Para reproducir el vídeo en bucle, podemos usar loop=1 como parámetro de consulta, 
pero no es suficiente; necesitas añadir playlist=id, donde id es el ID del vídeo, por ejemplo:
https://www.youtube.com/embed/dQw4w9WgXcQ?loop=1&playlist=dQw4w9WgXcQ

Haz que tu vídeo se reproduzca en bucle sobre las demás propiedades.
-->
<!DOCTYPE html>
<html>
    <body>
        <!-- Código corregido para bucle de YouTube -->
        <iframe width="560" height="315" src="https://www.youtube.com/embed/JMzihl_sStA?loop=1&playlist=JMzihl_sStA&mute=1&autoplay=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </body>
</html>
